[package]
name = "backend"
version = "0.1.0"
edition = "2021"
default-run = "backend"

[dependencies]
axum = { version = "0.8", features = ["macros", "multipart"] }
reqwest = { version = "0.13", default-features = false, features = ["form", "json", "rustls"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.7", features = ["cors", "trace"] }

sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "uuid", "chrono", "migrate", "macros", "rust_decimal"] }

serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

rust_decimal = { version = "1", default-features = false, features = ["serde", "std"] }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter", "std"] }
tracing-opentelemetry = "0.33"
opentelemetry = { version = "0.32", features = ["metrics"] }
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio", "metrics"] }
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic", "trace", "metrics"] }
metrics = "0.24"
metrics-exporter-prometheus = "0.18"

anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
csv = "1"
regex = "1"

lapin = { version = "4", features = ["rustls"] }
deadpool-lapin = "0.14"

jsonwebtoken = "9"
argon2 = { version = "0.5", features = ["std"] }

utoipa = { version = "5", features = ["axum_extras", "chrono", "uuid", "decimal"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }

[[bin]]
name = "backend"
path = "src/main.rs"

[[bin]]
name = "gen-openapi"
path = "src/bin/gen-openapi.rs"