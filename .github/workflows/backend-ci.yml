name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'api/openapi/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'api/openapi/**'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTFLAGS: "-D warnings"
      DATABASE_URL: postgres://pudim:pudim@localhost:5432/pudimfinance
      RABBITMQ_URL: amqp://pudim:pudim@localhost:5672
    services:
      postgres:
        # Check the latest at https://hub.docker.com/_/postgres/tags
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: pudim
          POSTGRES_PASSWORD: pudim
          POSTGRES_DB: pudimfinance
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      rabbitmq:
        # Check the latest at https://hub.docker.com/_/rabbitmq/tags
        image: rabbitmq:4.3.5-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: pudim
          RABBITMQ_DEFAULT_PASS: pudim
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      # Check the latest at https://github.com/actions/checkout/releases
      - uses: actions/checkout@v7

      # Check the latest at https://github.com/actions-rust-lang/setup-rust-toolchain/releases
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: clippy, rustfmt
          cache: false

      - name: Cache dependencies
        # Check the latest at https://github.com/Swatinem/rust-cache/releases
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --release

      - name: Generate OpenAPI spec
        run: cargo run --release --bin gen-openapi > /tmp/openapi-generated.json

      - name: Compare OpenAPI spec with committed version
        run: diff ../api/openapi/openapi.json /tmp/openapi-generated.json

      - name: Run tests
        run: cargo test --release
        env:
          RUST_LOG: backend=debug

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    steps:
      # Check the latest at https://github.com/actions/checkout/releases
      - uses: actions/checkout@v7

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Audit dependencies
        run: cargo audit