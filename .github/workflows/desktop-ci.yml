name: desktop-ci

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'shared/**'
      - 'api/openapi/openapi.json'
      - 'scripts/**'
      - '.dockerignore'
      - '.github/workflows/desktop-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'shared/**'
      - 'api/openapi/openapi.json'
      - 'scripts/**'
      - '.dockerignore'
      - '.github/workflows/desktop-ci.yml'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: '22'

jobs:
  desktop:
    name: Desktop (typecheck, lint, tauri build)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: Cache Rust crates
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: desktop-cargo-${{ runner.os }}-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}

      - name: Cache node_modules
        uses: actions/cache@v6
        with:
          path: desktop/node_modules
          key: desktop-npm-${{ runner.os }}-${{ hashFiles('desktop/package-lock.json') }}

      - name: Install Linux system dependencies (Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            javascriptcoregtk-4.1-dev \
            patchelf

      - name: Install Node dependencies
        working-directory: desktop
        run: npm ci

      - name: Typecheck (frontend)
        working-directory: desktop
        run: npm run typecheck

      - name: Lint (frontend)
        working-directory: desktop
        run: npm run lint

      - name: Android composition smoke
        working-directory: desktop
        run: npm run test:android

      - name: Widget aggregation smoke
        working-directory: desktop
        run: npm run test:widget

      - name: Request timeout smoke
        working-directory: desktop
        run: npm run test:request-timeout

      - name: Build frontend
        working-directory: desktop
        run: npm run build

      - name: Rustfmt check
        working-directory: desktop/src-tauri
        run: cargo fmt --check

      - name: Clippy (Rust core)
        working-directory: desktop/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Rustfmt check (Android capture plugin)
        working-directory: desktop/src-tauri/plugins/pudim-android-native
        run: cargo fmt --check

      - name: Clippy (Android capture plugin)
        working-directory: desktop/src-tauri/plugins/pudim-android-native
        run: cargo clippy --all-targets -- -D warnings

      - name: Build Tauri app
        working-directory: desktop
        run: npm run tauri build

  android:
    name: Android (tauri android build)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Cache Rust crates
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: android-cargo-${{ runner.os }}-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}

      - name: Cache node_modules
        uses: actions/cache@v6
        with:
          path: desktop/node_modules
          key: android-npm-${{ runner.os }}-${{ hashFiles('desktop/package-lock.json') }}

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up JDK 17 (Android build)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Rust Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install Node dependencies
        working-directory: desktop
        run: npm ci

      - name: Typecheck (frontend)
        working-directory: desktop
        run: npm run typecheck

      - name: Build frontend
        working-directory: desktop
        run: npm run build

      # GitHub-hosted runners ship the Android SDK and NDK (ANDROID_HOME set).
      # tauri-cli resolves the NDK under $ANDROID_HOME/ndk automatically.
      - name: Initialize Android project
        working-directory: desktop
        run: npm run tauri android init

      # `android init` seeds the generated project with Tauri's default launcher
      # art. The manifest keeps the desktop artwork unchanged while providing an
      # inset adaptive foreground for Android's masked launcher safe area.
      - name: Generate Android launcher icons
        working-directory: desktop
        run: npm run icons

      # gen/ is gitignored and re-created by `android init` above, so the release
      # config (keystore.properties + app/build.gradle.kts) has to be injected on
      # every run — see https://v2.tauri.app/distribute/sign/android/.
      # With the keystore secrets set the APK is signed with the upload key;
      # without them the script falls back to the debug keystore (with a warning)
      # so the workflow still publishes an installable APK instead of an unsigned
      # one. It also allows cleartext HTTP, without which Android blocks the
      # `http://<lan-ip>:3000` servers the client targets ("Could not reach the
      # server"); set PUDIM_ALLOW_CLEARTEXT=false to keep Android's safe default.
      - name: Prepare the Android release build (signing + cleartext HTTP + Credential Manager)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 || secrets.ANDROID_KEY_BASE64 || secrets.RELEASE_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || secrets.RELEASE_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || secrets.ANDROID_KEY_PASSWORD || secrets.RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.RELEASE_KEY_PASSWORD || secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: python3 scripts/android-release-setup.py

      # `--apk` skips the (unused) AAB bundle; add `--aab` back if the app ever
      # goes to the Play Store.
      - name: Build Android app (aarch64)
        working-directory: desktop
        run: npm run tauri android build -- --target aarch64 --apk

      - name: Kotlin unit tests (Android native plugin)
        working-directory: desktop/src-tauri/gen/android
        run: ./gradlew :pudim-native:testDebugUnitTest --no-daemon

      # Pull requests still build the APK for validation, but only main pushes
      # and manual runs publish a downloadable artifact. Only the release output
      # directory is uploaded (never a debug APK).
      # Fails loudly if the APK is not signed, and records the signing key in the
      # job summary so every run states which key produced the artifact
      # (upload key vs. the debug fallback used when no secret is configured).
      - name: Verify the release APK is signed
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          count=0
          while IFS= read -r apk; do
            count=$((count + 1))
            certs=$("$apksigner" verify --print-certs "$apk") || {
              echo "::error::$apk is not signed — refusing to publish an uninstallable APK"
              exit 1
            }
            echo "$certs"
            if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
              {
                printf '### Signed APK: %s\n\n' "$(basename "$apk")"
                echo "$certs" | grep -E '^Signer #1 certificate (DN|SHA-256 digest): ' | sed 's/^/- /'
                echo
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          done < <(find desktop/src-tauri/gen/android/app/build/outputs/apk -path '*/release/*.apk' -print)
          if [ "$count" -eq 0 ]; then
            echo '::error::no release APK was produced'
            exit 1
          fi

      - name: Upload APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: pudimfinance-android-apk
          path: desktop/src-tauri/gen/android/app/build/outputs/apk/**/release/*.apk
          if-no-files-found: error
          retention-days: 30

  offline:
    name: Offline sync smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: pudim
          POSTGRES_PASSWORD: pudim
          POSTGRES_DB: pudimfinance
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      rabbitmq:
        image: rabbitmq:4.3.5-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: pudim
          RABBITMQ_DEFAULT_PASS: pudim
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache-workspaces: backend
          cache-key: offline-backend

      - name: Cache Node dependencies
        uses: actions/cache@v6
        with:
          path: desktop/node_modules
          key: offline-npm-${{ runner.os }}-${{ hashFiles('desktop/package-lock.json') }}

      - name: Install Node dependencies
        working-directory: desktop
        run: npm ci

      - name: Build backend (release)
        working-directory: backend
        env:
          DATABASE_URL: postgres://pudim:pudim@localhost:5432/pudimfinance
          RABBITMQ_URL: amqp://pudim:pudim@localhost:5672
        run: cargo build --release

      - name: Start backend
        working-directory: backend
        env:
          DATABASE_URL: postgres://pudim:pudim@localhost:5432/pudimfinance
          RABBITMQ_URL: amqp://pudim:pudim@localhost:5672
          SERVER_HOST: 0.0.0.0
          SERVER_PORT: 3000
          JWT_SECRET: ci-offline-smoke-secret
          RUST_LOG: backend=info
        run: |
          ./target/release/backend > /tmp/pudimfinance-backend.log 2>&1 &
          pid=$!
          echo "$pid" > /tmp/pudimfinance-backend.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:3000/health >/dev/null; then
              echo "backend healthy after ${attempt}s"
              exit 0
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              echo '::error::backend exited before becoming healthy'
              cat /tmp/pudimfinance-backend.log
              exit 1
            fi
            sleep 1
          done
          echo '::error::backend did not become healthy within 60s'
          cat /tmp/pudimfinance-backend.log
          exit 1

      - name: Offline sync smoke
        working-directory: desktop
        run: npm run test:offline

  web:
    name: Web (nginx image + smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # The same image the LAN server publishes on WEB_PORT (see docker-compose.yml).
      - name: Build web image
        run: docker build -f desktop/Dockerfile.web -t pudimfinance-web:ci .

      - name: Smoke-test the served SPA
        # `backend` is only consulted by /api|/health; nginx resolves upstream
        # names when the config loads, so give it a dummy address or it refuses
        # to start outside the compose network.
        run: |
          docker run -d --name pudim-web-ci --add-host backend:127.0.0.1 -p 8080:80 pudimfinance-web:ci
          for _ in $(seq 1 20); do
            if curl -fsS http://localhost:8080 >/dev/null 2>&1; then break; fi
            sleep 1
          done

          shell=$(curl -fsS http://localhost:8080)
          echo "$shell" | grep -q 'id="root"' || { echo 'SPA shell not served'; exit 1; }
          asset=$(echo "$shell" | grep -o '/assets/[^"]*\.js' | head -1)
          test -n "$asset" || { echo 'no hashed JS bundle referenced'; exit 1; }
          curl -fsS "http://localhost:8080${asset}" | head -c 200 >/dev/null
          # Deep links fall back to the shell (the SPA routes under /#/...).
          curl -fsS http://localhost:8080/transactions | grep -q 'id="root"'
          docker rm -f pudim-web-ci
