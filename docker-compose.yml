services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pudim
      POSTGRES_PASSWORD: pudim
      POSTGRES_DB: pudimfinance
    ports:
      - "${PG_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pudim -d pudimfinance"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: pudim
      RABBITMQ_DEFAULT_PASS: pudim
    ports:
      - "${RABBIT_PORT:-5672}:5672"
      - "${RABBIT_MGMT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgres://pudim:pudim@postgres:5432/pudimfinance
      RABBITMQ_URL: amqp://pudim:pudim@rabbitmq:5672
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 3000
      # JWT signing secret. Override with a long random value in production.
      # Changing it invalidates all existing sessions.
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me-in-production}
      # Comma-separated public Google OAuth client IDs (Android and Desktop).
      GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS:-}
      # Exact client ID paired with the server-only Google client secret below.
      GOOGLE_CLIENT_SECRET_CLIENT_ID: ${GOOGLE_CLIENT_SECRET_CLIENT_ID:-}
      # Server-only secret for a confidential Google OAuth client, if required.
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      RUST_LOG: backend=debug,tower_http=debug
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  # Web client — the `desktop/` frontend built as a static SPA behind nginx
  # (replaces the retired `web/` React SPA). Open http://<PUBLIC_HOST>:<WEB_PORT>.
  # The bundle is built with an empty VITE_API_BASE_URL, so the SPA talks to the
  # backend on the same origin: nginx proxies /api and /health to `backend:3000`.
  web:
    build:
      # Context is the repo root (not ./desktop) because the client imports the
      # shared i18n/icons from ../shared — they must be in the build.
      context: .
      dockerfile: desktop/Dockerfile.web
      args:
        # Empty → same-origin (nginx proxy, no client setup needed). Set to e.g.
        # http://192.168.1.100:3000 to have the SPA call the backend directly.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    ports:
      - "${WEB_PORT:-5173}:80"
    depends_on:
      - backend
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.53.0
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:11.1.0
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana-dashboard.json:/var/lib/grafana/dashboards/dashboard.json:ro
      - ./infra/grafana-provider.yml:/etc/grafana/provisioning/dashboards/dashboard.yml:ro
      - ./infra/grafana-datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
    depends_on:
      - prometheus

volumes:
  pgdata:
  prometheus_data:
  grafana_data:
