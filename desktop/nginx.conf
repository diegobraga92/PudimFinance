# PudimFinance web client — static SPA + same-origin API proxy.
#
# The SPA uses a HashRouter, so every route lives under /#/... and the server
# only ever serves index.html. The API proxy makes /api/* and /health resolve
# against the backend on the same origin, which is what the bundle's empty
# VITE_API_BASE_URL expects (no per-browser "Server" configuration needed).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Receipt/reconciliation payloads are JSON and can be a few hundred KB.
    client_max_body_size 10m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;

    # ── Static assets ──────────────────────────────────────────────
    # Vite emits content-hashed file names, so they can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The HTML shell must never be cached, or clients keep loading stale chunks.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # SPA fallback (also covers a hard refresh on a deep link).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Backend API (same-origin proxy) ────────────────────────────
    # The backend serves routes under /api/..., so the URI is passed through
    # unchanged (no trailing slash on proxy_pass).
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check used by the client's offline probe and by operators.
    location = /health {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Prometheus metrics.
    location = /metrics {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger UI + OpenAPI spec.
    location /swagger-ui {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api-docs/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
