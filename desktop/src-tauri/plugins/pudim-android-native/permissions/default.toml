"$schema" = "schemas/schema.json"

[default]
description = "Default permissions for the PudimFinance native plugin (capture, secure storage, biometric, widget)"
permissions = [
  "allow-is-supported",
  "allow-access-granted",
  "allow-open-settings",
  "allow-open-external",
  "allow-google-sign-in",
  "allow-drain-pending",
  "allow-show-capture-prompt",
  "allow-cancel-capture-prompt",
  "allow-drain-capture-actions",
  "allow-notification-posting-allowed",
  "allow-request-notification-permission",
  "allow-set-capture-settings",
  "allow-set-sync-config",
  "allow-sync-outbox-put",
  "allow-sync-outbox-remove",
  "allow-drain-sync-results",
  "allow-clear-sync-outbox",
  "allow-secure-get",
  "allow-secure-set",
  "allow-secure-delete",
  "allow-biometric-available",
  "allow-biometric-authenticate",
  "allow-set-widget-spending",
  "allow-set-widget-theme",
  "allow-take-deep-link",
  "allow-take-auth-redirect",
  "allow-register-listener",
  "allow-remove-listener",
]
