[package]
name = "pudim-android-native"
version = "0.1.0"
description = "PudimFinance Android notification capture (bank transaction alerts) + access helpers"
edition = "2021"
links = "pudim-native"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(any(target_os = "ios", target_os = "android"))'.dependencies]
tauri = { version = "2", features = ["wry"] }
